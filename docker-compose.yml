version: '3.8'

services:
  # Backend Service
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: knowledge-base-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - APP_NAME=Knowledge Base API
      - DB_FILE=/app/data/docstore.db
      - EMBEDDINGS_DB_FILE=/app/data/embeddings.db
      # CORS_ORIGINS=http://localhost:3000,http://localhost:80,http://frontend
      # ML — сменить модель:
      #   paraphrase-multilingual-mpnet-base-v2  (по умолчанию, 1.5 ГБ, 50+ языков)
      #   paraphrase-multilingual-MiniLM-L12-v2  (420 МБ, 50+ языков, быстрее)
      #   all-MiniLM-L6-v2                       (90 МБ, только EN, самая быстрая)
      - ML_MODEL_NAME=paraphrase-multilingual-MiniLM-L12-v2
      - ML_DEVICE=cpu
      - ML_CHUNK_SIZE=300
      - ML_CHUNK_OVERLAP=1
      - ML_TOP_K=3
      - ML_RERANKER_ENABLED=false
      - ML_RERANKER_MODEL_NAME=cross-encoder/mmarco-mMiniLMv2-L12-H384-v1
      - ML_RERANK_CANDIDATES=20
    volumes:
      # Persist databases
      - ./data:/app/data
      # Cache for ML models
      - ./model-cache:/root/.cache/embedding_models
      # Development: mount source code (comment out for production)
      # - ./backend:/app
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Frontend Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: knowledge-base-frontend
    restart: unless-stopped
    ports:
      - "3000:80"
    environment:
      - REACT_APP_API_URL=http://localhost:8000
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s

networks:
  app-network:
    driver: bridge
